# =============================================================================
# GitLab CI/CD - Granit
# =============================================================================
# Pipeline : build -> quality -> security -> analysis -> pack -> publish
#
# Le stage build valide la compilation et réchauffe le cache NuGet.
# Les artifacts bin/obj sont trop volumineux (~20K fichiers, >500 MB)
# pour être partagés via artifacts GitLab. Chaque job rebuild avec le
# cache NuGet (restore rapide ~5-10s).
#
# Les packages NuGet sont publiés sur GitLab Package Registry.
# Publication automatique sur tag vX.Y.Z sur main.
#
# Variables requises (Settings > CI/CD > Variables) :
#   Aucune — utilise le CI_JOB_TOKEN natif pour le Package Registry
#
# Variables optionnelles :
#   SONAR_HOST_URL  : URL du serveur SonarQube (ex: https://sonar.digitaldynamics.be)
#   SONAR_TOKEN     : Token d'authentification SonarQube (masked)
# =============================================================================

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

include:
  - template: Security/Secret-Detection.gitlab-ci.yml
  - template: Security/SAST.gitlab-ci.yml

variables:
  DOTNET_VERSION: "10.0"
  CONFIGURATION: Release
  NUGET_SOURCE: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/nuget/index.json"
  NUGET_PACKAGES: '${CI_PROJECT_DIR}/.nuget/packages'

stages:
  - build
  - quality
  - gitlab-security
  - analysis
  - docs
  - pack
  - publish
  - deploy

default:
  interruptible: true

# ---------------------------------------------------------------------------
# HIDDEN JOBS
# ---------------------------------------------------------------------------

.dotnet:
  image: mcr.microsoft.com/dotnet/sdk:10.0
  tags:
    - docker
  cache:
    key:
      files:
        - Directory.Packages.props
    paths:
      - .nuget/packages/
    policy: pull

# ---------------------------------------------------------------------------
# BUILD (validation + cache NuGet warm-up)
# ---------------------------------------------------------------------------

build:
  extends: .dotnet
  stage: build
  cache:
    key:
      files:
        - Directory.Packages.props
    paths:
      - .nuget/packages/
    policy: pull-push
  script:
    - dotnet restore
    - dotnet build -c $CONFIGURATION --no-restore -p:SkipIntegrationTests=true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# ---------------------------------------------------------------------------
# QUALITY
# ---------------------------------------------------------------------------

format:
  extends: .dotnet
  stage: quality
  needs:
    - job: build
      artifacts: false
  script:
    - dotnet restore
    - dotnet format --verify-no-changes --no-restore
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"

test:
  extends: .dotnet
  stage: quality
  needs:
    - job: build
      artifacts: false
  variables:
    VSTEST_CONNECTION_TIMEOUT: "300"
    XUNIT_LAUNCH_TIMEOUT: "300"
  script:
    - dotnet build -c $CONFIGURATION -p:SkipIntegrationTests=true
    - >
      dotnet test -c $CONFIGURATION --no-build -p:SkipIntegrationTests=true
      --logger "junit;LogFilePath=TestResults/results.xml"
      --collect:"XPlat Code Coverage;Format=opencover,cobertura"
      -- RunConfiguration.MaxCpuCount=2
  artifacts:
    when: always
    paths:
      - "**/coverage.opencover.xml"
    reports:
      junit: "**/TestResults/results.xml"
      coverage_report:
        coverage_format: cobertura
        path: "**/coverage.cobertura.xml"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

integration-test:
  extends: .dotnet
  stage: quality
  needs:
    - job: build
      artifacts: false
  services:
    - name: postgres:18
      alias: postgres
      variables:
        POSTGRES_DB: granit_test
        POSTGRES_USER: granit_test
        POSTGRES_PASSWORD: test_password
  variables:
    # Variables utilisées par le fixture de test pour se connecter au service PostgreSQL
    # au lieu de Testcontainers (pas de DinD nécessaire).
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    POSTGRES_DB: granit_test
    POSTGRES_USER: granit_test
    POSTGRES_PASSWORD: test_password
  script:
    - dotnet build -c $CONFIGURATION
    - |
      for proj in tests/*.Tests.Integration/*.Tests.Integration.csproj; do
        dotnet test "$proj" -c $CONFIGURATION --no-build \
          --logger "junit;LogFilePath=TestResults/results.xml" \
          --collect:"XPlat Code Coverage;Format=opencover,cobertura"
      done
  artifacts:
    when: always
    paths:
      - "**/coverage.opencover.xml"
    reports:
      junit: "**/TestResults/results.xml"
      coverage_report:
        coverage_format: cobertura
        path: "**/coverage.cobertura.xml"
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"

# ---------------------------------------------------------------------------
# SECURITY
# ---------------------------------------------------------------------------

secret_detection:
  stage: gitlab-security
  tags:
    - docker
  before_script: []
  allow_failure: false

sast:
  stage: gitlab-security
  tags:
    - docker
  before_script: []

semgrep-sast:
  stage: gitlab-security
  tags:
    - docker
  before_script: []
  allow_failure: false
  timeout: 10m

# --- TRIVY DEPENDENCY SCAN (NuGet) ---
trivy:fs:
  stage: gitlab-security
  image:
    name: aquasec/trivy:0.69.1
    entrypoint: ['']
  tags:
    - docker
  before_script: []
  cache:
    key: trivy-db
    paths:
      - .trivy-cache/
  variables:
    TRIVY_CACHE_DIR: .trivy-cache
  script:
    # Génère le rapport pour l'interface GitLab
    - trivy fs --format template --template "@/contrib/gitlab.tpl" --output gl-dependency-scanning-report.json .
    # Affiche le résumé et échoue si HIGH ou CRITICAL trouvé
    - trivy fs --exit-code 1 --severity HIGH,CRITICAL --no-progress .
  artifacts:
    reports:
      dependency_scanning: gl-dependency-scanning-report.json
  retry:
    max: 1
    when: runner_system_failure
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"

# ---------------------------------------------------------------------------
# ANALYSIS (SonarQube - après les tests)
# ---------------------------------------------------------------------------

sonarqube:
  extends: .dotnet
  stage: analysis
  timeout: 30m
  needs:
    - job: build
      artifacts: false
    - job: test
      artifacts: true
  variables:
    SONAR_USER_HOME: '${CI_PROJECT_DIR}/.sonar'
    GIT_DEPTH: '0'
  cache:
    key: sonar-${CI_PROJECT_ID}
    paths:
      - .sonar/cache
  script:
    - apt-get update -qq && apt-get install -y -qq openjdk-17-jre-headless > /dev/null 2>&1
    - dotnet tool install --global dotnet-sonarscanner
    - export PATH="$PATH:$HOME/.dotnet/tools"
    - >
      dotnet sonarscanner begin
      /k:"${CI_PROJECT_NAME}"
      /n:"${CI_PROJECT_TITLE}"
      /v:"${CI_COMMIT_REF_NAME}"
      /d:sonar.host.url="${SONAR_HOST_URL}"
      /d:sonar.token="${SONAR_TOKEN}"
      /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml"
      /d:sonar.exclusions=".nuget/**"
      /d:sonar.coverage.exclusions="**/Tests/**,**/test/**,**/*HostApplicationBuilderExtensions.cs,**/Granit*Module.cs"
      /d:sonar.issue.ignore.multicriteria="e1,e2"
      /d:sonar.issue.ignore.multicriteria.e1.ruleKey="csharpsquid:S6608"
      /d:sonar.issue.ignore.multicriteria.e1.resourceKey="**/*"
      /d:sonar.issue.ignore.multicriteria.e2.ruleKey="external_roslyn:IDE0007"
      /d:sonar.issue.ignore.multicriteria.e2.resourceKey="**/*"
      /d:sonar.qualitygate.wait="true"
    - dotnet build -c $CONFIGURATION
    - dotnet sonarscanner end /d:sonar.token="${SONAR_TOKEN}"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $SONAR_HOST_URL && $SONAR_TOKEN
    - if: $CI_COMMIT_BRANCH == "develop" && $SONAR_HOST_URL && $SONAR_TOKEN
    - if: $CI_COMMIT_BRANCH == "main" && $SONAR_HOST_URL && $SONAR_TOKEN
  allow_failure: true

audit:nuget:
  extends: .dotnet
  stage: analysis
  needs:
    - job: build
      artifacts: false
  script:
    - dotnet restore
    - dotnet list package --vulnerable --include-transitive 2>&1 | tee vulnerability-report.txt
    - '! grep -q "has the following vulnerable packages" vulnerability-report.txt'
  artifacts:
    when: always
    paths:
      - vulnerability-report.txt
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"
  allow_failure: true

# ---------------------------------------------------------------------------
# DOCS (DocFX — référence API C#)
# ---------------------------------------------------------------------------

docfx:
  extends: .dotnet
  stage: docs
  needs:
    - job: build
      artifacts: false
  script:
    - dotnet tool install -g docfx
    - export PATH="$PATH:$HOME/.dotnet/tools"
    - dotnet restore
    - docfx metadata docfx.json
    - docfx build docfx.json
  artifacts:
    paths:
      - _site/
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"
  allow_failure: true

pages:
  stage: deploy
  interruptible: false
  tags:
    - docker
  image: alpine:latest
  needs:
    - job: docfx
      artifacts: true
  script:
    - mv _site public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# ---------------------------------------------------------------------------
# PACK
# ---------------------------------------------------------------------------

pack:
  extends: .dotnet
  stage: pack
  needs:
    - job: build
      artifacts: false
  script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        VERSION="${CI_COMMIT_TAG#v}"
      else
        VERSION="0.1.0-dev.${CI_PIPELINE_IID}"
      fi
    - dotnet build -c $CONFIGURATION
    - dotnet pack -c $CONFIGURATION --no-build -p:PackageVersion=$VERSION -o ./nupkgs
  artifacts:
    paths:
      - nupkgs/
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# ---------------------------------------------------------------------------
# PUBLISH (GitLab Package Registry)
# ---------------------------------------------------------------------------

publish:
  extends: .dotnet
  stage: publish
  interruptible: false
  script:
    - dotnet nuget add source "$NUGET_SOURCE" --name gitlab --username gitlab-ci-token --password "$CI_JOB_TOKEN" --store-password-in-clear-text
    - dotnet nuget push "nupkgs/*.nupkg" --source gitlab
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  needs:
    - pack
