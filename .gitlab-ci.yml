# =============================================================================
# GitLab CI/CD - DigitalDynamics.Foundation
# =============================================================================
# Pipeline : quality -> security -> analysis -> pack -> publish
#
# Les packages NuGet sont publiés sur GitLab Package Registry.
# Publication automatique sur tag vX.Y.Z sur main.
#
# Variables requises (Settings > CI/CD > Variables) :
#   Aucune — utilise le CI_JOB_TOKEN natif pour le Package Registry
#
# Variables optionnelles :
#   SONAR_HOST_URL  : URL du serveur SonarQube (ex: https://sonar.digitaldynamics.be)
#   SONAR_TOKEN     : Token d'authentification SonarQube (masked)
# =============================================================================

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

include:
  - template: Security/Secret-Detection.gitlab-ci.yml
  - template: Security/SAST.gitlab-ci.yml

variables:
  DOTNET_VERSION: "10.0"
  CONFIGURATION: Release
  NUGET_SOURCE: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/nuget/index.json"
  NUGET_PACKAGES: '${CI_PROJECT_DIR}/.nuget/packages'

stages:
  - quality
  - gitlab-security
  - analysis
  - pack
  - publish

# ---------------------------------------------------------------------------
# HIDDEN JOBS
# ---------------------------------------------------------------------------

.dotnet:
  image: mcr.microsoft.com/dotnet/sdk:10.0
  tags:
    - docker
  cache:
    key:
      files:
        - Directory.Packages.props
    paths:
      - .nuget/packages/
    policy: pull-push

# ---------------------------------------------------------------------------
# QUALITY
# ---------------------------------------------------------------------------

format:
  extends: .dotnet
  stage: quality
  script:
    - dotnet format --verify-no-changes
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

build:
  extends: .dotnet
  stage: quality
  script:
    - dotnet restore
    - dotnet build -c $CONFIGURATION --no-restore
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

test:
  extends: .dotnet
  stage: quality
  script:
    - dotnet build -c $CONFIGURATION
    - >
      dotnet test -c $CONFIGURATION --no-build
      --logger "junit;LogFilePath=TestResults/results.xml"
      --collect:"XPlat Code Coverage;Format=opencover,cobertura"
  artifacts:
    when: always
    paths:
      - "**/coverage.opencover.xml"
    reports:
      junit: "**/TestResults/results.xml"
      coverage_report:
        coverage_format: cobertura
        path: "**/coverage.cobertura.xml"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# ---------------------------------------------------------------------------
# SECURITY
# ---------------------------------------------------------------------------

secret_detection:
  stage: gitlab-security
  tags:
    - docker
  before_script: []
  allow_failure: false

sast:
  stage: gitlab-security
  tags:
    - docker
  before_script: []

semgrep-sast:
  stage: gitlab-security
  tags:
    - docker
  before_script: []
  allow_failure: false

# ---------------------------------------------------------------------------
# ANALYSIS (SonarQube - après les tests)
# ---------------------------------------------------------------------------

sonarqube:
  extends: .dotnet
  stage: analysis
  needs:
    - job: test
      artifacts: true
  variables:
    SONAR_USER_HOME: '${CI_PROJECT_DIR}/.sonar'
    GIT_DEPTH: '0'
  cache:
    key: sonar-${CI_PROJECT_ID}
    paths:
      - .sonar/cache
  script:
    - apt-get update -qq && apt-get install -y -qq openjdk-17-jre-headless > /dev/null 2>&1
    - dotnet tool install --global dotnet-sonarscanner
    - export PATH="$PATH:$HOME/.dotnet/tools"
    - >
      dotnet sonarscanner begin
      /k:"DD-Foundation"
      /n:"DD Foundation"
      /v:"${CI_COMMIT_REF_NAME}"
      /d:sonar.host.url="${SONAR_HOST_URL}"
      /d:sonar.token="${SONAR_TOKEN}"
      /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml"
      /d:sonar.coverage.exclusions="**/Tests/**,**/test/**"
      /d:sonar.exclusions=".nuget/**"
      /d:sonar.qualitygate.wait=true
    - dotnet build -c $CONFIGURATION
    - dotnet sonarscanner end /d:sonar.token="${SONAR_TOKEN}"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $SONAR_HOST_URL && $SONAR_TOKEN
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $SONAR_HOST_URL && $SONAR_TOKEN
  allow_failure: true

audit:nuget:
  extends: .dotnet
  stage: analysis
  script:
    - dotnet restore
    - dotnet list package --vulnerable --include-transitive 2>&1 | tee vulnerability-report.txt
    - '! grep -q "has the following vulnerable packages" vulnerability-report.txt'
  artifacts:
    when: always
    paths:
      - vulnerability-report.txt
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  allow_failure: true

# ---------------------------------------------------------------------------
# PACK
# ---------------------------------------------------------------------------

pack:
  extends: .dotnet
  stage: pack
  script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        VERSION="${CI_COMMIT_TAG#v}"
      else
        VERSION="0.1.0-dev.${CI_PIPELINE_IID}"
      fi
    - dotnet build -c $CONFIGURATION
    - dotnet pack -c $CONFIGURATION --no-build -p:PackageVersion=$VERSION -o ./nupkgs
  artifacts:
    paths:
      - nupkgs/
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# ---------------------------------------------------------------------------
# PUBLISH (GitLab Package Registry)
# ---------------------------------------------------------------------------

publish:
  extends: .dotnet
  stage: publish
  script:
    - dotnet nuget add source "$NUGET_SOURCE" --name gitlab --username gitlab-ci-token --password "$CI_JOB_TOKEN" --store-password-in-clear-text
    - dotnet nuget push "nupkgs/*.nupkg" --source gitlab
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  needs:
    - pack
