# =============================================================================
# SonarQube — Project configuration
# =============================================================================
# Static properties are defined here. Dynamic properties (host URL, token,
# version) remain as CLI arguments in .gitlab-ci.yml.
# =============================================================================

# Key and name are now provided by CI variables ($CI_PROJECT_NAME, $CI_PROJECT_TITLE)
# via /k: and /n: arguments in .gitlab-ci.yml

# Coverage reports (OpenCover format from dotnet test)
sonar.cs.opencover.reportsPaths=**/coverage.opencover.xml

# Analysis exclusions — not analyzed at all
sonar.exclusions=.nuget/**

# Coverage exclusions — analyzed but excluded from coverage metrics
sonar.coverage.exclusions=\
  **/Tests/**,\
  **/test/**,\
  **/*HostApplicationBuilderExtensions.cs,\
  **/Granit*Module.cs

# Ignored rules — conflict with project conventions
# S6608: "use var instead of explicit type" — project convention is No var (IDE0008)
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=csharpsquid:S6608
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*

# Wait for quality gate result before finishing the CI job
sonar.qualitygate.wait=true
